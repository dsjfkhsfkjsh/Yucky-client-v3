name: Build Yucky

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Build Yucky
        run: gradle build --stacktrace

      - name: Check JAR contents
        run: |
          test -s build/libs/yucky-1.0.0.jar
          jar tf build/libs/yucky-1.0.0.jar | grep -q 'fabric.mod.json'
          jar tf build/libs/yucky-1.0.0.jar | grep -q 'com/yucky/client/YuckyClient.class'

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: yucky-jar
          path: build/libs/yucky-1.0.0.jar
          if-no-files-found: error
